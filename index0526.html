<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>五十音與生活日語練習（含字卡模式）</title>
<style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    #kana { font-size: 90px; margin: 20px 0; cursor: pointer; }
    #romaji { font-size: 40px; margin-top: -10px; display: none; }
    .option-btn {
        display: block; 
        margin: 8px auto; 
        padding: 10px 20px; 
        font-size: 22px;
        cursor: pointer; 
        width: 250px; 
    }
    #message { font-size: 22px; height: 40px; color: red; }
    .section { margin: 15px 0; }
    .note { color: #555; font-size: 16px; margin-top: 10px; }
    .big-label { font-size: 22px; margin: 0 5px; display: inline-block; }
    .big-radio { transform: scale(1.5); margin-right: 5px; }
</style>
</head>
<body>

<h1>五十音與生活日語練習（含字卡/測驗模式）</h1>

<div class="section">
    <label class="big-label"><input class="big-radio" type="radio" name="type" value="hiragana" checked> 平假名</label>
    <label class="big-label"><input class="big-radio" type="radio" name="type" value="katakana"> 片假名</label>
</div>

<div class="section">
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-basic" checked> 清音</label>
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-dakuon"> 濁音</label>
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-handakuon"> 半濁音</label>
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-youon"> 拗音</label>
    <br><br>
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-money"> 金錢 (円)</label>
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-time"> 時間 (時)</label>
    <label class="big-label"><input class="big-radio" type="checkbox" id="chk-week"> 星期 (曜日)</label>
</div>

<div class="section">
    <label class="big-label"><input class="big-radio" type="radio" name="mode" value="quiz" checked> 測驗模式</label>
    <label class="big-label"><input class="big-radio" type="radio" name="mode" value="flashcard"> 字卡模式</label>
</div>

<div class="section">
    <label class="big-label"><input class="big-radio" type="radio" name="qaMode" value="kana2romaji" checked> 假名/漢字 → 羅馬音</label>
    <label class="big-label"><input class="big-radio" type="radio" name="qaMode" value="romaji2kana"> 羅馬音 → 假名/漢字</label>
</div>

<button id="startBtn" onclick="newQuestion()" style="font-size:22px;margin:10px;padding:10px 20px;">開始 / 下一題</button>

<div id="kana">あ</div>
<div id="romaji">a</div>

<div id="options"></div>
<div id="message"></div>

<script>
let voiceUnlocked = false;
let audioPlayer = new Audio();

// ------------------------------------------------------
// 假名與生活日語資料庫
// ------------------------------------------------------
const data = {
    basic: [
        ["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
        ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
        ["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],
        ["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],
        ["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
        ["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],
        ["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],
        ["や","ya"],["ゆ","yu"],["よ","yo"],
        ["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],
        ["わ","wa"],["を","wo"],["ん","n"]
    ],
    dakuon: [
        ["が","ga"],["ぎ","gi"],["ぐ","gu"],["げ","ge"],["ご","go"],
        ["ざ","za"],["じ","ji"],["ず","zu"],["ぜ","ze"],["ぞ","zo"],
        ["だ","da"],["ぢ","ji"],["づ","zu"],["де","de"],["ど","do"], // 修正原檔 de 拼字
        ["ば","ba"],["び","bi"],["ぶ","bu"],["べ","be"],["ぼ","bo"]
    ],
    handakuon: [
        ["ぱ","pa"],["ぴ","pi"],["ぷ","pu"],["ぺ","pe"],["ぽ","po"]
    ],
    youon: [
        ["きゃ","kya"],["きゅ","kyu"],["きょ","kyo"],
        ["しゃ","sha"],["しゅ","shu"],["しょ","sho"],
        ["ちゃ","cha"],["ちゅ","chu"],["ちょ","cho"],
        ["にゃ","nya"],["にゅ","nyu"],["にょ","nyo"],
        ["ひゃ","hya"],["ひゅ","hyu"],["ひょ","hyo"],
        ["みゃ","mya"],["みゅ","myu"],["みょ","myo"],
        ["りゃ","rya"],["りゅ","ryu"],["りょ","ryo"],
        ["ぎゃ","gya"],["ぎゅ","gyu"],["ぎょ","gyo"],
        ["じゃ","ja"],["じゅ","ju"],["じょ","jo"],
        ["びゃ","bya"],["びゅ","byu"],["びょ","byo"],
        ["ぴゃ","pya"],["ぴゅ","pyu"],["ぴょ","pyo"]
    ],
    // 新增：金錢學習資料 (漢字型態，羅馬拼音包含 -en)
    money: [
        ["100円 (百円)","hyaku-en"], ["200円 (二百円)","nihyaku-en"],
        ["300円 (三百円)","sanbyaku-en"], ["400円 (四百円)","yonhyaku-en"],
        ["500円 (五百円)","gohyaku-en"], ["600円 (六百円)","roppyaku-en"],
        ["700円 (七百円)","nanahyaku-en"], ["800円 (八百円)","happyaku-en"],
        ["900円 (九百円)","kyūhyaku-en"], ["1000円 (千円)","sen-en"],
        ["2000円 (二千円)","nisen-en"], ["3000円 (三千円)","sanzen-en"],
        ["4000円 (四千円)","yonsen-en"], ["5000円 (五千円)","gosen-en"],
        ["10000円 (一万円)","ichiman-en"]
    ],
    // 新增：時間學習資料 (1~12點，注意 4, 7, 9 點特殊讀音)
    time: [
        ["1時 (一時)","ichi-ji"], ["2時 (二時)","ni-ji"],
        ["3時 (三時)","san-ji"], ["4時 (四時)","yo-ji"],
        ["5時 (五時)","go-ji"], ["6時 (六時)","roku-ji"],
        ["7時 (七時)","shichi-ji"], ["8時 (八時)","hachi-ji"],
        ["9時 (九時)","ku-ji"], ["10時 (十時)","jū-ji"],
        ["11時 (十一時)","jūichi-ji"], ["12時 (十二時)","jūni-ji"]
    ],
    // 新增：星期學習資料
    week: [
        ["月曜日 (星期一)","getsubi"], ["火曜日 (星期二)","kayōbi"],
        ["水曜日 (星期三)","suiyōbi"], ["木曜日 (星期四)","mokuyōbi"],
        ["金曜日 (星期五)","kinyōbi"], ["土曜日 (星期六)","doyōbi"],
        ["日曜日 (星期日)","nichiyōbi"]
    ]
};

// ------------------------------------------------------
// 音檔對應表（新增金錢、時間、星期的音檔路徑）
// ------------------------------------------------------
const audioMap = {
    // 清音
    "a":"audio/a.mp3","i":"audio/i.mp3","u":"audio/u.mp3","e":"audio/e.mp3","o":"audio/o.mp3",
    "ka":"audio/ka.mp3","ki":"audio/ki.mp3","ku":"audio/ku.mp3","ke":"audio/ke.mp3","ko":"audio/ko.mp3",
    "sa":"audio/sa.mp3","shi":"audio/shi.mp3","su":"audio/su.mp3","se":"audio/se.mp3","so":"audio/so.mp3",
    "ta":"audio/ta.mp3","chi":"audio/chi.mp3","tsu":"audio/tsu.mp3","te":"audio/te.mp3","to":"audio/to.mp3",
    "na":"audio/na.mp3","ni":"audio/ni.mp3","nu":"audio/nu.mp3","ne":"audio/ne.mp3","no":"audio/no.mp3",
    "ha":"audio/ha.mp3","hi":"audio/hi.mp3","fu":"audio/fu.mp3","he":"audio/he.mp3","ho":"audio/ho.mp3",
    "ma":"audio/ma.mp3","mi":"audio/mi.mp3","mu":"audio/mu.mp3","me":"audio/me.mp3","mo":"audio/mo.mp3",
    "ya":"audio/ya.mp3","yu":"audio/yu.mp3","yo":"audio/yo.mp3",
    "ra":"audio/ra.mp3","ri":"audio/ri.mp3","ru":"audio/ru.mp3","re":"audio/re.mp3","ro":"audio/ro.mp3",
    "wa":"audio/wa.mp3","wo":"audio/wo.mp3","n":"audio/n.mp3",

    // 濁音
    "ga":"audio/ga.mp3","gi":"audio/gi.mp3","gu":"audio/gu.mp3","ge":"audio/ge.mp3","go":"audio/go.mp3",
    "za":"audio/za.mp3","ji":"audio/ji.mp3","zu":"audio/zu.mp3","ze":"audio/ze.mp3","zo":"audio/zo.mp3",
    "da":"audio/da.mp3","du":"audio/du.mp3","de":"audio/de.mp3","do":"audio/do.mp3",
    "ba":"audio/ba.mp3","bi":"audio/bi.mp3","bu":"audio/bu.mp3","be":"audio/be.mp3","bo":"audio/bo.mp3",

    // 半濁音
    "pa":"audio/pa.mp3","pi":"audio/pi.mp3","pu":"audio/pu.mp3","pe":"audio/pe.mp3","po":"audio/po.mp3",

    // 拗音
    "kya":"audio/kya.mp3","kyu":"audio/kyu.mp3","kyo":"audio/kyo.mp3",
    "sha":"audio/sha.mp3","shu":"audio/shu.mp3","sho":"audio/sho.mp3",
    "cha":"audio/cha.mp3","chu":"audio/chu.mp3","cho":"audio/cho.mp3",
    "nya":"audio/nya.mp3","nyu":"audio/nyu.mp3","nyo":"audio/nyo.mp3",
    "hya":"audio/hya.mp3","hyu":"audio/hyu.mp3","hyo":"audio/hyo.mp3",
    "mya":"audio/mya.mp3","myu":"audio/myu.mp3","myo":"audio/myo.mp3",
    "rya":"audio/rya.mp3","ryu":"audio/ryu.mp3","ryo":"audio/ryo.mp3",
    "gya":"audio/gya.mp3","gyu":"audio/gyu.mp3","gyo":"audio/gyo.mp3",
    "ja":"audio/ja.mp3","ju":"audio/ju.mp3","jo":"audio/jo.mp3",
    "bya":"audio/bya.mp3","byu":"audio/byu.mp3","byo":"audio/byo.mp3",
    "pya":"audio/pya.mp3","pyu":"audio/pyu.mp3","pyo":"audio/pyo.mp3",

    // 新增：金錢音檔
    "hyaku-en":"audio/hyaku-en.mp3","nihyaku-en":"audio/nihyaku-en.mp3","sanbyaku-en":"audio/sanbyaku-en.mp3",
    "yonhyaku-en":"audio/yonhyaku-en.mp3","gohyaku-en":"audio/gohyaku-en.mp3","roppyaku-en":"audio/roppyaku-en.mp3",
    "nanahyaku-en":"audio/nanahyaku-en.mp3","happyaku-en":"audio/happyaku-en.mp3","kyūhyaku-en":"audio/kyūhyaku-en.mp3",
    "sen-en":"audio/sen-en.mp3","nisen-en":"audio/nisen-en.mp3","sanzen-en":"audio/sanzen-en.mp3",
    "yonsen-en":"audio/yonsen-en.mp3","gosen-en":"audio/gosen-en.mp3","ichiman-en":"audio/ichiman-en.mp3",

    // 新增：時間音檔
    "ichi-ji":"audio/ichi-ji.mp3","ni-ji":"audio/ni-ji.mp3","san-ji":"audio/san-ji.mp3","yo-ji":"audio/yo-ji.mp3",
    "go-ji":"audio/go-ji.mp3","roku-ji":"audio/roku-ji.mp3","shichi-ji":"audio/shichi-ji.mp3","hachi-ji":"audio/hachi-ji.mp3",
    "ku-ji":"audio/ku-ji.mp3","jū-ji":"audio/jū-ji.mp3","jūichi-ji":"audio/jūichi-ji.mp3","jūni-ji":"audio/jūni-ji.mp3",

    // 新增：星期音檔
    "getsubi":"audio/getsubi.mp3","kayōbi":"audio/kayōbi.mp3","suiyōbi":"audio/suiyōbi.mp3",
    "mokuyōbi":"audio/mokuyōbi.mp3","kinyōbi":"audio/kinyōbi.mp3","doyōbi":"audio/doyōbi.mp3",
    "nichiyōbi":"audio/nichiyōbi.mp3"
};

function hiraToKata(str){
    return str.replace(/[\u3041-\u3096]/g, ch =>
        String.fromCharCode(ch.charCodeAt(0) + 0x60)
    );
}

function speakKana(key, shouldNext){
    if(audioMap[key]){
        audioPlayer.src = audioMap[key];
        audioPlayer.onended = () => {
            if(shouldNext){
                newQuestion();
            }
        };
        audioPlayer.play().catch(e=>{
            console.warn("播放失敗：", e);
        });
    } else {
        console.warn("找不到音檔：", key);
    }
}

let selectedGroups = [];
let answerRomaji = "";
let answerKana = "";
let useHira = true;
let flashStep = 0;

function flashClick(){
    const romajiDiv = document.getElementById("romaji");
    if(flashStep === 0){
        romajiDiv.style.display = "block";
        speakKana(answerRomaji, true);   // 永遠用 romaji 播音檔
        flashStep = 1;
    } else {
        newQuestion();
    }
}

// ------------------------------------------------------
// 產生題目
// ------------------------------------------------------
function newQuestion(){
    useHira = document.querySelector("input[name=type]:checked").value === "hiragana";
    const mode = document.querySelector("input[name=mode]:checked").value;
    const qaMode = document.querySelector("input[name=qaMode]:checked").value;

    let pool = [];
    if(document.getElementById("chk-basic").checked) pool.push(data.basic);
    if(document.getElementById("chk-dakuon").checked) pool.push(data.dakuon);
    if(document.getElementById("chk-handakuon").checked) pool.push(data.handakuon);
    if(document.getElementById("chk-youon").checked) pool.push(data.youon);
    
    // 納入新題庫
    if(document.getElementById("chk-money").checked) pool.push(data.money);
    if(document.getElementById("chk-time").checked) pool.push(data.time);
    if(document.getElementById("chk-week").checked) pool.push(data.week);

    if(pool.length === 0){
        alert("請至少選 1 類題目");
        return;
    }

    selectedGroups = pool;

    // 隨取一組大類，再從中抽一題
    let group = pool[Math.floor(Math.random()*pool.length)];
    let [kana, romaji] = group[Math.floor(Math.random()*group.length)];

    answerRomaji = romaji;
    
    // 如果是生活語音類（含中文字或數字），就不做平假名/片假名轉換
    if (group === data.money || group === data.time || group === data.week) {
        answerKana = kana; 
    } else {
        answerKana = useHira ? kana : hiraToKata(kana);
    }

    const kanaDiv = document.getElementById("kana");
    const romajiDiv = document.getElementById("romaji");
    const optDiv = document.getElementById("options");
    const msg = document.getElementById("message");

    romajiDiv.textContent = answerRomaji;
    kanaDiv.textContent = answerKana;
    msg.textContent = "";

    // 字卡模式
    if(mode === "flashcard"){
        optDiv.style.display = "none";
        romajiDiv.style.display = "none";
        flashStep = 0;
        kanaDiv.onclick = flashClick;
        return;
    }

    // 測驗模式
    kanaDiv.onclick = null;
    optDiv.style.display = "block";
    romajiDiv.style.display = "none";

    let choiceSet = new Set();

    if(qaMode === "kana2romaji"){
        kanaDiv.textContent = answerKana;
        choiceSet.add(answerRomaji);
        while(choiceSet.size < Math.min(5, getTotalOptions(pool))){
            let g = pool[Math.floor(Math.random()*pool.length)];
            let r = g[Math.floor(Math.random()*g.length)][1];
            choiceSet.add(r);
        }
    } else {
        kanaDiv.textContent = answerRomaji;
        choiceSet.add(answerKana);
        while(choiceSet.size < Math.min(5, getTotalOptions(pool))){
            let g = pool[Math.floor(Math.random()*pool.length)];
            let [k] = g[Math.floor(Math.random()*g.length)];
            let kanaOut = (g === data.money || g === data.time || g === data.week) ? k : (useHira ? k : hiraToKata(k));
            choiceSet.add(kanaOut);
        }
    }

    let choiceList = Array.from(choiceSet).sort(()=>Math.random()-0.5);
    optDiv.innerHTML = "";

    choiceList.forEach(opt => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
		btn.style.cssText = `
			font-size: 24px;
			margin: 10px auto;
			padding: 10px 20px;
		`;
		
		btn.onclick = () => {
			let correct = checkAnswer(opt, qaMode);
			if(correct){
				// 答對 → 播放正確答案的音檔後切下一題
				speakKana(answerRomaji, true);
			} else {
				// 答錯 → 播放你點選那個選項的音檔（如果有的話），但不切題
                let targetKey = qaMode === "kana2romaji" ? opt : findRomajiByKana(opt);
				speakKana(targetKey, false);
			}
		};
        optDiv.appendChild(btn);
    });
}

function checkAnswer(opt, qaMode){
    const msg = document.getElementById("message");
    if(qaMode === "kana2romaji"){
        if(opt === answerRomaji){
            return true;
        } else {
            msg.textContent = "再試一次！";
            return false;
        }
    } else {
        if(opt === answerKana){
            return true;
        } else {
            msg.textContent = "再試一次！";
            return false;
        }
    }
}

// 輔助函式：計算當前勾選題庫的總題數，避免死循環
function getTotalOptions(pool) {
    return pool.reduce((sum, g) => sum + g.length, 0);
}

// 輔助函式：用假名反查羅馬拼音（錯誤音檔播放用）
function findRomajiByKana(kanaStr) {
    for (let key in data) {
        for (let pair of data[key]) {
            if (pair[0] === kanaStr || hiraToKata(pair[0]) === kanaStr) {
                return pair[1];
            }
        }
    }
    return "";
}
</script>
</body>
</html>
